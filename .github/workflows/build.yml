name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
      release_note:
        description: 'Short release note shown in the update prompt'
        required: true
        type: string

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Determine release note
        id: release_note
        shell: bash
        env:
          INPUT_RELEASE_NOTE: ${{ inputs.release_note }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            note="$INPUT_RELEASE_NOTE"
          else
            remote_tag_ref="refs/release-tags/$RELEASE_TAG"
            git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:$remote_tag_ref"
            note="$(git for-each-ref --format='%(contents)' "$remote_tag_ref")"
          fi
          {
            echo 'note<<RELEASE_NOTE_EOF'
            echo "$note"
            echo 'RELEASE_NOTE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: ${{ steps.tag.outputs.tag }}
          releaseBody: ${{ steps.release_note.outputs.note }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 3
          args: --target ${{ matrix.target }} --bundles nsis

  publish-updater-manifest:
    name: Publish updater manifest
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Generate and upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          temp_dir="${RUNNER_TEMP}/updater-signatures"
          mkdir -p "$temp_dir"

          find_asset() {
            local suffix="$1"
            echo "$release_json" | jq -r --arg suffix "$suffix" \
              '.assets[] | select(.name | endswith($suffix)) | .name' | head -n 1
          }

          asset_url() {
            local name="$1"
            echo "$release_json" | jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | .browser_download_url'
          }

          signature() {
            local name="$1"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$name.sig" --dir "$temp_dir" --clobber >/dev/null
            tr -d '\r\n' < "$temp_dir/$name.sig"
          }

          windows_asset="$(find_asset 'x64-setup.exe')"
          test -n "$windows_asset"
          test "$(asset_url "$windows_asset")" != "null"

          jq -n \
            --arg version "$RELEASE_TAG" \
            --arg notes "ChatGPT 账号管家 ${RELEASE_TAG} 更新" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_url "$(asset_url "$windows_asset")" \
            --arg win_sig "$(signature "$windows_asset")" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {
              "windows-x86_64": {signature: $win_sig, url: $win_url}
            }}' > latest.json

          jq empty latest.json
          gh release upload "$RELEASE_TAG" latest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
